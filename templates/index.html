<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Point 3D | UGM</title>
    
    <!-- Web Logo / Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-3 mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-3" href="#">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Web Logo">
                <span class="brand-text fs-4">Class Point 3D</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container main-container mb-5">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="card-title fw-bold text-dark mb-1">Point Cloud Classification</h5>
                <p class="text-muted small mb-4">Upload a <code>.las</code> or <code>.laz</code> file to execute XGBoost semantic segmentation.</p>

                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <input class="form-control" type="file" id="lasFile" accept=".las,.laz">
                    </div>
                    <div class="col-md-6 d-flex gap-2 flex-wrap">
                        <button id="uploadBtn" class="btn btn-primary px-4 fw-semibold" onclick="processFile()">
                            Start Classification
                        </button>
                        
                        <button id="replayBtn" class="btn btn-outline-secondary btn-icon d-none" onclick="resetApp()">
                            <img src="{{ url_for('static', filename='replay.png') }}" alt="Replay">
                            Reset / Replay
                        </button>
                    </div>
                </div>

                <!-- Status & Loading Spinner -->
                <div id="statusMessage" class="alert d-none" role="alert"></div>
                <div id="loadingSpinner" class="d-none text-center my-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3D Plot Section -->
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-0 fw-bold py-3">
                        Original Point Cloud (RGB)
                    </div>
                    <div class="card-body p-2">
                        <div id="plotOrig" class="plot-container"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-0 fw-bold py-3 text-primary">
                        Classified Point Cloud
                    </div>
                    <div class="card-body p-2">
                        <div id="plotClassified" class="plot-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-3 mt-auto">
        <div class="container d-flex align-items-center justify-content-center gap-3">
            <img src="{{ url_for('static', filename='ugm.png') }}" alt="UGM Logo" class="footer-ugm-logo">
            <div class="footer-text">
                <div><strong>Department of Geodetic Engineering</strong></div>
                <div>Faculty of Engineering UGM</div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
